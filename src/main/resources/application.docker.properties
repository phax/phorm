# Should be set to "false" in production
global.debug=false
# Should be set to "true" in production
global.production=true

# Should be set to the absolute path to store some data in production
webapp.datapath=/phorm/data
webapp.checkfileaccess=false
# Should be set to "false" in production
webapp.testversion=true

# This is the secret token you need to pass in all API calls to get a response
# Please customize to your needs before deploying
# [CHANGEME]
# See also "application.properties"
phorm.api.requiredtoken=phorm-dev-token

# Return HTTP 400 on failed validations?
phorm.api.response.onfailure.http400=true

# Should the validation response be logged?
phorm.api.response.log.payload=false

# The secret token for the admin API (/api/admin/*), passed in the "X-Token" HTTP header
# If empty, the admin API is disabled
phorm.api.admin.token=

# The path to the XML file describing additional local validation repositories
# (namespace "urn:fdc:com:helger:diver:repoconfig:v1.0"). If empty, no additional repositories are used.
# Relative paths inside the file are resolved against the directory of the file.
phorm.repositories.file=
